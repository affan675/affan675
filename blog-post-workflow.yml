name: Latest blog posts workflow
on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours (rate limit friendly)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update with blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/affan675"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
          # If you don't have posts, it will leave the existing text.
          # To show a "no posts yet" message, keep your README as is.