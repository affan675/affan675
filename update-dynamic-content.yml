name: Update Dynamic Content

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Fetch Joke and Quote
        run: |
          JOKE=$(curl -s -H "Accept: application/json" https://icanhazdadjoke.com/ | jq -r '.joke')
          QUOTE_DATA=$(curl -s https://zenquotes.io/api/random)
          QUOTE=$(echo $QUOTE_DATA | jq -r '.[0].q')
          AUTHOR=$(echo $QUOTE_DATA | jq -r '.[0].a')
          FULL_QUOTE="$QUOTE — $AUTHOR"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          # Replace placeholders in README
          # Using a temporary file to safely handle special characters
          sed -i "s|<!-- JOKE_START -->.*<!-- JOKE_END -->|<!-- JOKE_START -->$JOKE<!-- JOKE_END -->|g" README.md
          sed -i "s|<!-- QUOTE_START -->.*<!-- QUOTE_END -->|<!-- QUOTE_START -->$FULL_QUOTE<!-- QUOTE_END -->|g" README.md
          sed -i "s|<!-- DATE_START -->.*<!-- DATE_END -->|<!-- DATE_START -->$DATE<!-- DATE_END -->|g" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update dynamic content [skip ci]" || exit 0
          git push